# ============================================================
# Model Definition: DiT-Large
# ============================================================

name: "DiT-Large"
model_id: "dit_large"
model_type: "transformer"
description: "Diffusion Transformer DiT-L/4 for image generation (256x256)"

training:
  batch_size: 32
  seq_len: 4096                       # 64x64 latent patches at patch_size=4 → (64/4)^2 = 256... using flattened 4096 for 256x256 direct
  dtype: "fp16"
  optimizer: "adamw"
  optimizer_memory_multiplier: 2.0
  gradient_dtype: "fp32"
  mixed_precision: true
  activation_checkpointing: false
  dataset: "dit"                      # ImageNet latent diffusion
  backward_ratio: 2.1
  # DiT uses timestep and class conditioning
  num_timesteps: 1000
  conditioning: "adaLN-Zero"

architecture:
  type: "transformer_encoder"         # DiT is encoder-only with conditioning

  patch_embedding:
    input_size: 32                    # 256x256 images → 32x32 latents (VAE 8x downsample)
    patch_size: 4                     # patch_size=4 → (32/4)^2 = 64 patches
    num_patches: 64
    in_channels: 4                    # VAE latent channels
    hidden_dim: 1024

  embedding:
    vocab_size: 0
    hidden_dim: 1024
    max_seq_len: 64
    pos_embedding: "learned"

  encoder:
    num_layers: 24
    hidden_dim: 1024
    num_heads: 16
    head_dim: 64                      # 1024 / 16
    ffn_dim: 4096                     # 4 × 1024
    ffn_activation: "gelu"
    dropout: 0.0
    layer_norm: "pre"
    layer_norm_type: "adaLN"          # Adaptive LayerNorm with zero-init

  conditioning:
    timestep_dim: 256
    class_dim: 1000
    hidden_dim: 1024

stats:
  total_params_M: 458.0
  total_flops_forward_G: 80.7         # GFLOPs for batch=1
  model_size_fp16_gb: 0.875