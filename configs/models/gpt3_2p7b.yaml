# ============================================================
# Model Definition: GPT-3 2.7B
# ============================================================

name: "GPT-3 2.7B"
model_id: "gpt3_2p7b"
model_type: "transformer"
description: "GPT-3 2.7B decoder-only language model (Cerebras benchmark)"

training:
  batch_size: 4
  seq_len: 2048
  dtype: "fp16"
  optimizer: "adamw"
  optimizer_memory_multiplier: 2.0
  gradient_dtype: "fp32"
  mixed_precision: true
  activation_checkpointing: true
  checkpointing_memory_factor: 0.3
  dataset: "OpenWebText"
  backward_ratio: 2.1

architecture:
  type: "transformer_decoder"

  embedding:
    vocab_size: 50257
    hidden_dim: 2560
    max_seq_len: 2048

  decoder:
    num_layers: 32
    hidden_dim: 2560
    num_heads: 32
    head_dim: 80                      # 2560 / 32
    ffn_dim: 10240                    # 4 × 2560
    ffn_activation: "gelu"
    dropout: 0.1
    layer_norm: "pre"
    causal_attention: true

stats:
  total_params_M: 2700.0
  total_flops_forward_G: 5530.0       # GFLOPs for batch=1, seq=2048
  model_size_fp16_gb: 5.157