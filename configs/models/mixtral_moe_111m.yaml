# ============================================================
# Model Definition: Mixtral MoE 111M
# ============================================================
# Scaled-down MoE for ALCF benchmark suite.
# Architecture mirrors Mixtral 8x7B ratios but at 111M param scale.

name: "Mixtral MoE 111M"
model_id: "mixtral_moe_111m"
model_type: "transformer"
description: "Mixtral-style sparse MoE 111M (8 experts, top-2 routing)"

training:
  batch_size: 8
  seq_len: 2048
  dtype: "bf16"
  optimizer: "adamw"
  optimizer_memory_multiplier: 2.0
  gradient_dtype: "fp32"
  mixed_precision: true
  activation_checkpointing: true
  checkpointing_memory_factor: 0.3
  dataset: "SlimPajama"
  backward_ratio: 2.1

architecture:
  type: "transformer_decoder"

  embedding:
    vocab_size: 32000
    hidden_dim: 512
    max_seq_len: 2048

  decoder:
    num_layers: 8
    hidden_dim: 512
    num_heads: 8
    num_kv_heads: 2                   # GQA
    head_dim: 64
    # MoE FFN params
    moe: true
    num_experts: 8
    num_experts_active: 2             # Top-2 routing
    expert_ffn_dim: 1024              # Per-expert intermediate dim
    ffn_activation: "silu"
    dropout: 0.0
    layer_norm: "pre"
    layer_norm_type: "rmsnorm"
    causal_attention: true

stats:
  total_params_M: 111.0
  total_params_active_M: 36.0         # Active params per token (top-2 of 8)
  total_flops_forward_G: 73.8         # Uses active params for FLOP count
  model_size_fp16_gb: 0.212           # bf16